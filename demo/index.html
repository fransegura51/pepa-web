<!doctype html>
<html lang="es">

    <meta name="theme-color" content="#12A594" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <title>Prueba PEPA con una familia de ejemplo | PEPA Family App</title>

    <!--

      bloqueara el rastreo, el buscador no llegaría a ver este noindex.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Página de entrada propia, separada del resto de la web: su
      paquete no incluye el cliente de Supabase, ni los textos/imágenes
      editables de la web, ni ningún formulario. Sin red, sin cuentas.
    -->
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
